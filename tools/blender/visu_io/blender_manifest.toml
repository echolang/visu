schema_version = "1.0.0"

id = "visu_io"
version = "0.3.1"
name = "VISU model I/O"
tagline = "Import and export VISU glb, PNG maps, and JSON"
maintainer = "VISU"
type = "add-on"

tags = ["Import-Export"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Read and write glb, PNG, and JSON next to the model"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "tests/",
  "/.*",
  "/*.zip",
]
